const b2u = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const u2b = u => btoa(String.fromCharCode.apply(null, new Uint8Array(u)));
const KEYNAME = 'afp-dash-key';
async function keyFrom(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b2u(P.s), iterations: P.n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);

}
